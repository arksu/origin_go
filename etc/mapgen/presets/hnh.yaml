version: 1 # Версия формата конфигурации; поддерживается 1.
world:
  chunks_x: 50 # Ширина мира в чанках; один чанк содержит 128 тайлов по каждой оси.
  chunks_y: 50 # Высота мира в чанках; 50 чанков дают 6400 тайлов.
  seed: 378605981 # Начальное число генератора: одинаковое значение воспроизводит карту; 0 выбирает по времени.
  threads: 24 # Количество рабочих потоков для параллельных этапов генерации.
  # Базовая частота шума Перлина: больше — мельче и чаще детали рельефа и озёра; меньше — крупнее и плавнее.
  # Этот же масштаб используется как основа климатических полей, поэтому изменение также меняет размер пятен климата.
  terrain_scale: 0.002
  # Вода из низких значений шума высоты. false убирает только озёра/воду Перлина, но сохраняет рисуемые реки и озёра речной сети.
  perlin_water_enabled: false
river:
  shape_wavelength_tiles: 163
  fairway_width_tiles: 3
  tributary_ratio: 0.6
  tributary_spacing_tiles: 180
  tributary_length_min: 100
  tributary_length_max: 360
  enabled: true # Включить добавление речной сети и озёр поверх воды, заданной высотой рельефа.
  layout_draw: true # true: рисовать связи между озёрами; false: прокладывать реки по рельефу вниз.
  major_count: 700 # Бюджет основных речных связей в рисуемой сети; фактически связей может быть меньше.
  lake_count: 200 # Целевое количество рисуемых озёр; теснота карты может ограничить размещение.
  lake_size_small_min: 12 # Минимальный базовый радиус малого озера, тайлы; применяется при layout_draw=true.
  lake_size_small_max: 34 # Максимальный базовый радиус малого озера, тайлы.
  lake_size_medium_min: 40 # Минимальный базовый радиус среднего озера, тайлы.
  lake_size_medium_max: 96 # Максимальный базовый радиус среднего озера, тайлы.
  lake_size_large_min: 108 # Минимальный базовый радиус большого озера, тайлы.
  lake_size_large_max: 260 # Максимальный базовый радиус большого озера, тайлы.
  lake_size_medium_chance: 0.26 # Целевая доля средних озёр среди рисуемых озёр, от 0 до 1.
  lake_size_large_chance: 0.08 # Целевая доля больших озёр; оставшаяся доля приходится на малые.
  lake_border_mix: 0.17 # Доля основных связей, направленных от озёр к границам карты, от 0 до 1.
  max_lake_degree: 3 # Максимальное количество речных связей одного озера в рисуемой сети.
  shape_waves_per_link: 0.5 # Базовое число волн первой октавы на длину связи, до множителя shape_frequency_scale.
  shape_frequency_scale: 0.45 # Множитель числа волн вдоль русла; больше — чаще повороты.
  shape_octaves: 4 # Количество октав когерентного шума в форме русла; больше — больше мелких изгибов внутри больших излучин.
  shape_octave_gain: 0.6 # Ослабление амплитуды каждой следующей октавы; длина волны каждой октавы вдвое короче предыдущей.
  shape_amplitude_scale: 0.75 # Множитель амплитуды изгибов рисуемого русла; больше — шире отклонения.
  shape_distance_cap: 0.9 # Верхний предел амплитуды изгибов как доля расстояния между концами связи.
  shape_along_scale: 0.04 # Сила случайных продольных смещений опорных точек русла.
  shape_segment_length: 51 # Масштаб расстояния между опорными точками, тайлы; меньше — больше точек (4–32 сегмента).
  meander_strength: 0.015 # Базовая сила извилистости; в рисуемой сети влияет на амплитуду изгибов.
  shape_long_meander_scale: 0.25 # Множитель meander_strength для основных длинных связей.
  shape_short_meander_scale: 0.1 # Множитель для коротких связей; используется максимум с meander_strength + bias.
  shape_short_meander_bias: 0.003 # Добавка к meander_strength во втором варианте амплитуды коротких связей.
  source_elevation_min: 0.9 # Минимальная нормализованная высота случайного истока; только при layout_draw=false.
  source_chance: 0.0018 # Вероятность истока на подходящем тайле; только при layout_draw=false.
  voronoi_cell_size: 92 # Размер ячеек Вороного, тайлы; направляют реки только при layout_draw=false.
  voronoi_edge_threshold: 0.15 # Ширина области влияния границ Вороного; только при layout_draw=false.
  voronoi_source_boost: 0.025 # Добавка к вероятности истока возле границы Вороного; только при layout_draw=false.
  voronoi_bias: 0.012 # Сила притяжения русел к границам Вороного; только при layout_draw=false.
  sink_lake_chance: 0.02 # Вероятность озера в точке остановки стока; только при layout_draw=false.
  lake_min_size: 44 # Минимальная площадь существующего озера для поиска связей, тайлы; только при layout_draw=false.
  lake_connect_chance: 0.72 # В рисуемой сети — целевая доля связанных озёр; в режиме рельефа — вероятность связи.
  lake_connection_limit: 149 # Бюджет дополнительных коротких связей озёр; в режиме рельефа — лимит озёрных связей.
  lake_link_min_distance: 100 # Нижний ориентир расстояния между связанными озёрами, тайлы; короткий проход допускает половину.
  lake_link_max_distance: 2846 # Верхний ориентир расстояния озёрных связей, тайлы; короткий проход ограничен ещё и размером мира.
  river_width_min: 5 # Минимальное значение ширины рисуемого речного коридора, тайлы.
  river_width_max: 20 # Максимальное значение ширины речного коридора, тайлы.
  grid_enabled: false # Добавлять реки от равномерной сетки истоков; только при layout_draw=false.
  grid_spacing: 720 # Расстояние между кандидатами сетки истоков, тайлы; используется при grid_enabled=true.
  grid_jitter: 70 # Максимальное случайное смещение кандидата сетки по каждой оси, тайлы.
  trunk_count: 10 # Количество кандидатов крупных магистральных рек; только при layout_draw=false.
  trunk_source_elevation_min: 0.58 # Минимальная высота кандидата магистрального истока; только при layout_draw=false.
  trunk_min_length: 150 # Минимальная длина принимаемой магистральной реки, тайлы; только при layout_draw=false.
  coast_sample_chance: 0.014 # Вероятность выбора береговой точки как выхода магистральной реки; только при layout_draw=false.
  flow_shallow_threshold: 27 # Порог накопленного стока для мелкой речной воды; это счётчик, не глубина в метрах.
  flow_deep_threshold: 71 # Порог накопленного стока для глубокой речной воды; должен быть выше мелководного порога.
  bank_radius: 1 # Радиус добавления мелководья вокруг глубокого русла, тайлы; 0 отключает расширение.
  lake_flow_threshold: 28 # Минимальный сток для создания озера в точке остановки; только при layout_draw=false.
biomes:
  enabled: true # Включить биомы; false оставляет базовый классификатор земли и существующую воду.
  blob_enabled: true # Включить органические пятна и их очистку; false оставляет траву, горы, камень и климатический песок.
  # Размеры size задают длину ветвей sz, а не радиус всего пятна; width задаёт толщину wd.
  # Основные перекрытия: лес < вересковая/пустошная область < болото; вода, горы, камень и песок защищены.
  blob_seed_spacing: 230 # Шаг сетки кандидатов основных биомов, тайлы; меньше — больше кандидатов.
  blob_seed_jitter: 0.45 # Смещение кандидата по каждой оси как доля половины ячейки, от 0 включительно до 1 исключительно.
  blob_secondary_spacing: 48 # Шаг отдельной сетки подлеска, грунта и глины, тайлы; меньше — чаще мелкие пятна.
  blob_skip_weight: 0.3 # Относительный вес пропуска основного кандидата; больше — чаще остаётся травяной фон.
  blob_forest_size_min: 136 # Минимальная длина ветви лесного пятна, тайлы.
  blob_forest_size_max: 150 # Максимальная длина ветви лесного пятна; всё пятно может простираться значительно дальше.
  blob_forest_width: 0 # Толщина лесного пятна wd, тайлы; 0 автоматически выбирает половину длины ветви sz.
  blob_forest_weight: 2.65 # Относительный вес леса при выборе основного биома; дополнительно усиливается влажностью.
  blob_heath_size_min: 35 # Минимальная длина ветви верескового пятна (heath), тайлы.
  blob_heath_size_max: 85 # Максимальная длина ветви верескового пятна, тайлы.
  blob_heath_width: 0 # Толщина верескового пятна, тайлы; 0 означает wd=sz/2.
  blob_heath_weight: 0.8 # Относительный вес heath; используется, когда климат не выбирает moor, и усиливается сухостью.
  blob_moor_size_min: 30 # Минимальная длина ветви пустошного пятна (moor), тайлы.
  blob_moor_size_max: 75 # Максимальная длина ветви пустошного пятна, тайлы.
  blob_moor_width: 0 # Толщина пустошного пятна, тайлы; 0 означает wd=sz/2.
  blob_moor_weight: 0.8 # Относительный вес moor при подходящей сухости или холоде; дополнительно усиливается сухостью.
  blob_swamp_size_min: 45 # Минимальная длина ветви болотного пятна, тайлы.
  blob_swamp_size_max: 100 # Максимальная длина ветви болотного пятна, тайлы.
  blob_swamp_width: 0 # Толщина болотного пятна, тайлы; 0 означает wd=sz/2.
  blob_swamp_weight: 0.7 # Относительный вес болота при подходящем климате; дополнительно усиливается мокротой.
  blob_thicket_size_min: 4 # Минимальная длина ветви подлеска, тайлы; подлесок рисуется только внутри леса.
  blob_thicket_size_max: 10 # Максимальная длина ветви подлеска, тайлы.
  blob_thicket_width: 0 # Толщина подлеска, тайлы; 0 означает wd=sz/2.
  blob_dirt_size_min: 3 # Минимальная длина ветви открытого грунта, тайлы; грунт рисуется только поверх травы.
  blob_dirt_size_max: 8 # Максимальная длина ветви открытого грунта, тайлы.
  blob_dirt_width: 0 # Толщина грунтового пятна, тайлы; 0 означает wd=sz/2.
  blob_clay_size_min: 2 # Минимальная длина ветви глиняного поля, тайлы; глина рисуется только поверх травы.
  blob_clay_size_max: 11 # Максимальная длина ветви глиняного поля, тайлы.
  blob_clay_width: 0 # Толщина глиняного поля, тайлы; 0 означает wd=sz/2.
  # Плотность — вероятность выбора на подходящем кандидате, а не доля тайлов всей карты.
  blob_thicket_density: 0.35 # Вероятность подлеска на лесном кандидате мелкой сетки, от 0 до 1.
  blob_dirt_density: 0.08 # Вероятность грунта на травяном кандидате; сумма с плотностью глины не должна превышать 1.
  blob_clay_density: 0.12 # Вероятность глины на травяном кандидате при прохождении климатического порога; площадь зависит и от размеров.
  blob_forest_cold_threshold: 0.45 # Ниже этой температуры лес хвойный; при равенстве и выше — лиственный.
  blob_moor_moisture_max: 0.36 # Moor выбирается при влажности ниже этого порога ИЛИ температуре ниже следующего порога.
  blob_moor_temperature_max: 0.42 # Порог холода для moor; если оба условия moor не выполнены, используется heath.
  blob_swamp_wetness_min: 0.55 # Болото допустимо при мокроте выше этого порога ИЛИ влажности выше следующего порога.
  blob_swamp_moisture_min: 0.72 # Альтернативный порог влажности для болота; условия проверяются в точке кандидата.
  blob_clay_wetness_min: 0.8 # Глина допустима при мокроте выше этого порога ИЛИ влажности выше следующего порога.
  blob_clay_moisture_min: 0.84 # Альтернативный порог влажности для глины; при провале обоих условий кандидат пропускается.
  blob_raggedness: 3 # Максимальное случайное смещение точек контура по каждой оси, тайлы; 0 отключает рваность.
  blob_islet_chance: 0.18 # Вероятность попытки отдельного островка биома у очередной точки периметра, от 0 до 1.
  blob_islet_spacing: 12 # Расстояние вдоль периметра между попытками островков, тайлы; меньше — больше попыток.
  blob_max_nodes: 88 # Максимальное количество узлов ветвящегося каркаса одного пятна; ограничивает сложность генерации.
  blob_max_depth: 16 # Максимальная глубина ветвления от корня; ограничивает число последовательных ветвей.
  hnh_smoothing_passes: 3 # Число проходов каждой из трёх процедур сглаживания основных биомов; 0 отключает сглаживание.
  hnh_min_patch_tiles: 24 # Минимальная площадь основной компоненты, тайлы; меньшие удаляются, а подлесок/грунт/глина/островки добавляются позже.
  hnh_swamp_clump_scale: 1.2 # Множитель мокроты, вычисляемой из влажности и континентальности; больше — легче проходят пороги болота и глины.
  hnh_mountain_rugged_threshold: 0.82 # Порог регионального горного поля, от 0 до 1; выше — меньше горной территории.
  mountain_massif_scale: 700 # Характерный линейный масштаб горных массивов, тайлы; меньше — мельче массивы; диапазон 1–4096.
  mountain_stone_scale: 400 # Масштаб каменных участков внутри гор, тайлы; от 1 до mountain_massif_scale.
  temperature_scale: 1 # Множитель частоты поля температуры; больше — мельче температурные области.
  moisture_scale: 1.1 # Множитель частоты поля влажности; больше — мельче влажные и сухие области.
  continentalness_scale: 1 # Множитель частоты поля континентальности; влияет на климатический песок и мокроту, а не форму материков.
  erosion_scale: 0.9 # Множитель частоты поля эрозии; сейчас сигнал вычисляется, но не влияет на выбор тайлов.
  weirdness_scale: 1.1 # Множитель частоты поля необычности; сейчас сигнал вычисляется, но не влияет на выбор тайлов.
  domain_warp_strength: 56 # Сила смещения координат климатических и горного полей, мировые единицы (12 единиц на тайл).
# Параметры ecology пока только валидируются и выводятся в лог; генератор не запускает экологические тики.
ecology:
  enabled: true # Зарезервированный переключатель экологического обновления; сейчас не меняет карту.
  tick_interval: 300 # Зарезервированный интервал экологических обновлений; сейчас не используется.
  cells_per_tick: 5000 # Зарезервированный лимит обрабатываемых ячеек за экологический тик.
  chunk_budget: 12 # Зарезервированный лимит обрабатываемых чанков за экологический тик.
  spread_scale: 1.0 # Зарезервированный множитель интенсивности распространения биомов.
png:
  export: true # Сохранять PNG при обычной генерации; флаги командной строки могут переопределить значение.
  overview_only: false # true включает режим одного обзорного PNG без записи мира в БД; false допускает обычную генерацию и PNG чанков.
  output_dir: map_png # Каталог PNG: обзор overview.png и, при полном экспорте, отдельные файлы в chunks/.
  scale: 1 # Размер тайла в пикселях PNG по каждой оси; 1 означает один пиксель на тайл.
  highlight_rivers: true # Подсвечивать речную воду отдельными цветами в PNG; на сами тайлы мира не влияет.
