<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapgen Layer Preview</title>
<style>
  :root {
    --panel-bg: #1b1d22;
    --panel-border: #2e3138;
    --control-bg: #24262c;
    --text: #d7d9de;
    --text-dim: #8d919b;
    --accent: #4da3ff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: #141519;
  }
  #app { display: flex; height: 100vh; }

  aside {
    width: 360px;
    min-width: 360px;
    overflow-y: auto;
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-border);
    padding: 12px 14px 32px;
  }
  aside h1 { font-size: 15px; margin: 2px 0 12px; }
  aside h2 { font-size: 12px; margin: 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }

  .control-block { border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { min-width: 90px; color: var(--text-dim); }
  .row input[type=number], .row select {
    width: 110px; background: var(--control-bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 4px; padding: 3px 6px;
  }
  #preset { width: 100%; padding: 6px; background: var(--control-bg); color: var(--text); border: 1px solid var(--panel-border); border-radius: 4px; }
  .hint { color: var(--text-dim); font-size: 12px; overflow-wrap: anywhere; }
  #presetStatus { min-height: 18px; }
  #presetStatus.error { color: var(--error); }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  button:disabled { opacity: 0.5; cursor: default; }
  button {
    background: var(--control-bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 4px; padding: 4px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1522; font-weight: 600; }

  .layer-check { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; }

  details.group { border: 1px solid var(--panel-border); border-radius: 6px; margin: 8px 0; background: var(--control-bg); }
  details.group summary { cursor: pointer; padding: 7px 10px; font-weight: 600; user-select: none; }
  details.group .fields { padding: 2px 10px 10px; }

  .field { margin: 7px 0; }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .field-head label { color: var(--text-dim); }
  .field-head input[type=number] {
    width: 84px; background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 4px; padding: 2px 5px;
  }
  .field input[type=range] { width: 100%; margin: 3px 0 0; accent-color: var(--accent); }
  .field-check { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .field-check label { color: var(--text-dim); }

  main { flex: 1; position: relative; overflow: hidden; background: #22242a; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #spinner {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(20, 21, 25, 0.85); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 8px 16px; pointer-events: none;
  }
  .spin {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--panel-border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #errorBar {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(60, 16, 16, 0.92); border: 1px solid var(--error);
    color: #ffd9d9; border-radius: 6px; padding: 8px 16px; max-width: 70%;
  }
  #status {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--text-dim); background: rgba(20, 21, 25, 0.75);
    border-radius: 4px; padding: 2px 10px; pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Mapgen Layer Preview</h1>
    <div class="control-block">
      <label for="preset">Preset file</label>
      <input type="text" id="preset" autocomplete="off" spellcheck="false" placeholder="hnh.yaml">
      <div class="row"><button id="loadPreset" type="button">Load</button><button id="savePreset" type="button" disabled>Save</button></div>
      <div class="hint">Enter or Load reads the file. Save writes current settings to this path, overwriting it or creating a new variant.</div>
      <div id="presetDirectory" class="hint"></div>
      <div id="presetStatus" class="hint" role="status" aria-live="polite"></div>
    </div>
    <fieldset id="settings" disabled>
    <div class="control-block">
      <h2>Run</h2>
      <div class="row" id="layersRow"><label>Layers</label><span id="layersBox"></span></div>
      <div class="row"><label for="seed">Seed</label><input type="number" id="seed"><button id="randomSeed" type="button">Random</button></div>
      <div class="row"><label for="worldSize">World size</label><select id="worldSize"></select></div>
      <div class="row"><label for="auto">Auto-regenerate</label><input type="checkbox" id="auto" checked></div>
      <button id="generate" type="button" class="primary">Generate</button>
    </div>
    <div id="groups"></div>
    </fieldset>
  </aside>
  <main id="viewport">
    <canvas id="canvas"></canvas>
    <div id="spinner" hidden><div class="spin"></div><span>Rendering&hellip;</span></div>
    <div id="errorBar" hidden></div>
    <div id="status"></div>
  </main>
</div>

<script>
"use strict";

const state = {
  schema: null,
  loadedPreset: null,
  loadSeq: 0,
  saving: false,
  seq: 0,
  controller: null,
  img: null,
  fitted: false,
  view: { scale: 1, tx: 0, ty: 0 },
};

const els = {
  preset: document.getElementById("preset"),
  loadPreset: document.getElementById("loadPreset"),
  savePreset: document.getElementById("savePreset"),
  presetDirectory: document.getElementById("presetDirectory"),
  presetStatus: document.getElementById("presetStatus"),
  settings: document.getElementById("settings"),
  layersBox: document.getElementById("layersBox"),
  seed: document.getElementById("seed"),
  randomSeed: document.getElementById("randomSeed"),
  worldSize: document.getElementById("worldSize"),
  auto: document.getElementById("auto"),
  generate: document.getElementById("generate"),
  groups: document.getElementById("groups"),
  canvas: document.getElementById("canvas"),
  spinner: document.getElementById("spinner"),
  errorBar: document.getElementById("errorBar"),
  status: document.getElementById("status"),
  viewport: document.getElementById("viewport"),
};

function fieldId(layerName, key) {
  return `f_${layerName}_${key}`;
}

function buildControls() {
  els.layersBox.replaceChildren();
  els.worldSize.replaceChildren();
  for (const layer of state.schema.layers) {
    const check = document.createElement("label");
    check.className = "layer-check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = layer.name;
    input.checked = true;
    input.addEventListener("change", onChange);
    check.append(input, document.createTextNode(layer.title));
    els.layersBox.append(check);
  }

  const sizes = state.schema.sizes.map(size => ({ columns: size.chunks, rows: size.chunks }));
  if (!sizes.some(size => size.columns === state.schema.chunks_x && size.rows === state.schema.chunks_y)) {
    sizes.push({ columns: state.schema.chunks_x, rows: state.schema.chunks_y });
  }
  for (const size of sizes) {
    const option = document.createElement("option");
    option.value = `${size.columns}x${size.rows}`;
    option.textContent = `${size.columns}\u00d7${size.rows} chunks (${size.columns * 128}\u00d7${size.rows * 128})`;
    els.worldSize.append(option);
  }
  els.worldSize.value = `${state.schema.chunks_x}x${state.schema.chunks_y}`;

  els.seed.value = String(state.schema.seed);
}

function buildGroups() {
  els.groups.replaceChildren();
  for (const layer of state.schema.layers) {
    const layerTitle = document.createElement("h2");
    layerTitle.textContent = layer.title + " parameters";
    els.groups.append(layerTitle);
    for (const group of layer.groups) {
      const details = document.createElement("details");
      details.className = "group";
      if (group.title === "Channel shape") details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = group.title;
      const fields = document.createElement("div");
      fields.className = "fields";
      for (const field of group.fields) fields.append(buildField(layer, field));
      details.append(summary, fields);
      els.groups.append(details);
    }
  }
}

function buildField(layer, field) {
  const wrap = document.createElement("div");
  if (field.type === "bool") {
    wrap.className = "field-check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = fieldId(layer.name, field.key);
    input.checked = Boolean(field.default);
    input.addEventListener("change", onChange);
    const label = document.createElement("label");
    label.htmlFor = input.id;
    label.textContent = field.label;
    wrap.append(input, label);
    return wrap;
  }

  wrap.className = "field";
  const head = document.createElement("div");
  head.className = "field-head";
  const label = document.createElement("label");
  const number = document.createElement("input");
  number.type = "number";
  number.id = fieldId(layer.name, field.key);
  label.htmlFor = number.id;
  label.textContent = field.label;
  number.step = field.step != null ? String(field.step) : "1";
  if (field.min != null) number.min = String(field.min);
  if (field.max != null) number.max = String(field.max);
  number.value = String(field.default);
  number.addEventListener("input", onChange);
  head.append(label, number);

  const range = document.createElement("input");
  range.type = "range";
  range.min = number.min || "0";
  range.max = number.max || "100";
  range.step = number.step;
  range.value = number.value;
  range.addEventListener("input", () => {
    number.value = range.value;
    onChange();
  });
  number.addEventListener("input", () => { range.value = number.value; });
  wrap.append(head, range);
  return wrap;
}

function onChange() {
  if (els.auto.checked) scheduleRender(500);
}

let debounceTimer = null;
function scheduleRender(delay) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runRender(), delay);
}

function selectedLayers() {
  return [...els.layersBox.querySelectorAll("input:checked")].map(i => i.value);
}

function collectParams() {
  const params = {};
  for (const layer of state.schema.layers) {
    const values = {};
    for (const group of layer.groups) {
      for (const field of group.fields) {
        const input = document.getElementById(fieldId(layer.name, field.key));
        if (field.type === "bool") values[field.key] = input.checked;
        else {
          const value = Number(input.value);
          if (input.value.trim() === "" || !Number.isFinite(value) || (field.type === "int" && !Number.isInteger(value))) {
            throw new Error(`${field.key} must be a valid ${field.type === "int" ? "integer" : "number"}`);
          }
          values[field.key] = value;
        }
      }
    }
    params[layer.param_key] = values;
  }
  return params;
}

function collectRequest() {
  const seed = Number(els.seed.value);
  if (els.seed.value.trim() === "" || !Number.isSafeInteger(seed)) throw new Error("Seed must be a safe integer");
  const [columns, rows] = els.worldSize.value.split("x").map(Number);
  return {
    preset: state.loadedPreset,
    seed,
    chunks_x: columns,
    chunks_y: rows,
    layers: selectedLayers(),
    params: collectParams(),
  };
}

function syncPresetQuery() {
  const url = new URL(window.location.href);
  const preset = els.preset.value.trim();
  if (preset) url.searchParams.set("preset", preset);
  else url.searchParams.delete("preset");
  window.history.replaceState(null, "", url);
}

function presetMessage(message, error = false) {
  els.presetStatus.textContent = message;
  els.presetStatus.classList.toggle("error", error);
}

async function loadPreset() {
  if (state.saving) return;
  const sequence = ++state.loadSeq;
  clearTimeout(debounceTimer);
  ++state.seq;
  if (state.controller) state.controller.abort();
  els.spinner.hidden = true;
  els.settings.disabled = true;
  els.savePreset.disabled = true;
  syncPresetQuery();
  presetMessage("Loading preset\u2026");
  try {
    const query = new URLSearchParams();
    if (els.preset.value.trim()) query.set("preset", els.preset.value.trim());
    const response = await fetch(`/api/defaults?${query}`, { cache: "no-store" });
    const payload = await response.json();
    if (sequence !== state.loadSeq) return;
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    state.schema = payload;
    state.loadedPreset = payload.preset;
    els.preset.value = payload.preset;
    els.presetDirectory.textContent = `Directory: ${payload.preset_directory}`;
    syncPresetQuery();
    buildControls();
    buildGroups();
    state.fitted = false;
    els.settings.disabled = false;
    els.savePreset.disabled = false;
    presetMessage(`Loaded ${payload.preset}`);
    hideError();
    await runRender();
  } catch (error) {
    if (sequence === state.loadSeq) presetMessage(String(error), true);
  }
}

async function savePreset() {
  if (state.saving || els.settings.disabled) return;
  state.saving = true;
  els.settings.disabled = true;
  els.savePreset.disabled = true;
  els.loadPreset.disabled = true;
  els.preset.disabled = true;
  try {
    const path = els.preset.value.trim();
    if (!path) throw new Error("Preset path must not be empty");
    const body = { ...collectRequest(), path };
    presetMessage("Saving preset\u2026");
    const response = await fetch("/api/preset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    state.loadedPreset = payload.preset;
    els.preset.value = payload.preset;
    syncPresetQuery();
    presetMessage(`Saved ${payload.preset}`);
  } catch (error) {
    presetMessage(String(error), true);
  } finally {
    state.saving = false;
    els.settings.disabled = false;
    els.savePreset.disabled = false;
    els.loadPreset.disabled = false;
    els.preset.disabled = false;
  }
}

async function runRender() {
  if (els.settings.disabled) return;
  const mySeq = ++state.seq;
  if (state.controller) state.controller.abort();
  state.controller = new AbortController();
  els.spinner.hidden = false;
  const started = performance.now();
  try {
    const body = collectRequest();
    const res = await fetch("/api/render", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: state.controller.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      if (mySeq !== state.seq) return;
      showError(err.error || `HTTP ${res.status}`);
      return;
    }
    const blob = await res.blob();
    const img = await createImageBitmap(blob);
    if (mySeq !== state.seq) { img.close(); return; }
    if (state.img) state.img.close();
    state.img = img;
    if (!state.fitted && img.width > 0) { fitView(); state.fitted = true; }
    draw();
    const elapsed = ((performance.now() - started) / 1000).toFixed(2);
    els.status.textContent = `Rendered in ${elapsed} s \u00b7 ${img.width}\u00d7${img.height}`;
    hideError();
  } catch (err) {
    if (mySeq === state.seq && err.name !== "AbortError") showError(String(err));
  } finally {
    if (mySeq === state.seq) els.spinner.hidden = true;
  }
}

function showError(message) {
  els.errorBar.textContent = message;
  els.errorBar.hidden = false;
}

function hideError() {
  els.errorBar.hidden = true;
}

function resizeCanvas() {
  els.canvas.width = els.viewport.clientWidth;
  els.canvas.height = els.viewport.clientHeight;
  draw();
}

function draw() {
  const ctx = els.canvas.getContext("2d");
  ctx.fillStyle = "#22242a";
  ctx.fillRect(0, 0, els.canvas.width, els.canvas.height);
  if (!state.img) return;
  const v = state.view;
  ctx.imageSmoothingEnabled = v.scale < 1;
  ctx.drawImage(state.img, v.tx, v.ty, state.img.width * v.scale, state.img.height * v.scale);
}

function fitView() {
  if (!state.img) return;
  const v = state.view;
  v.scale = Math.min(els.canvas.width / state.img.width, els.canvas.height / state.img.height);
  v.tx = (els.canvas.width - state.img.width * v.scale) / 2;
  v.ty = (els.canvas.height - state.img.height * v.scale) / 2;
  draw();
}

function zoomAt(px, py, factor) {
  const v = state.view;
  const next = Math.min(20, Math.max(0.05, v.scale * factor));
  const k = next / v.scale;
  v.tx = px - (px - v.tx) * k;
  v.ty = py - (py - v.ty) * k;
  v.scale = next;
  draw();
}

let dragging = false;
let lastX = 0;
let lastY = 0;

function canvasPoint(event) {
  const rect = els.canvas.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

els.canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const p = canvasPoint(event);
  zoomAt(p.x, p.y, Math.exp(-event.deltaY * 0.0012));
}, { passive: false });

els.canvas.addEventListener("mousedown", (event) => {
  if (event.button !== 0) return;
  dragging = true;
  const p = canvasPoint(event);
  lastX = p.x;
  lastY = p.y;
  els.canvas.classList.add("dragging");
});

window.addEventListener("mousemove", (event) => {
  if (!dragging) return;
  const p = canvasPoint(event);
  state.view.tx += p.x - lastX;
  state.view.ty += p.y - lastY;
  lastX = p.x;
  lastY = p.y;
  draw();
});

window.addEventListener("mouseup", () => {
  dragging = false;
  els.canvas.classList.remove("dragging");
});

els.canvas.addEventListener("dblclick", () => fitView());
window.addEventListener("resize", resizeCanvas);

els.randomSeed.addEventListener("click", () => {
  els.seed.value = String(Math.floor(Math.random() * 2147483647));
  onChange();
});
els.generate.addEventListener("click", () => runRender());
els.worldSize.addEventListener("change", onChange);
els.seed.addEventListener("input", onChange);
els.preset.addEventListener("input", () => {
  ++state.loadSeq;
  syncPresetQuery();
  presetMessage("Enter or Load to read this file; Save to store the current settings here.");
});
els.preset.addEventListener("keydown", event => {
  if (event.key === "Enter") { event.preventDefault(); loadPreset(); }
});
els.loadPreset.addEventListener("click", loadPreset);
els.savePreset.addEventListener("click", savePreset);
window.addEventListener("popstate", () => {
  els.preset.value = new URLSearchParams(window.location.search).get("preset") || "";
  loadPreset();
});

async function init() {
  els.preset.value = new URLSearchParams(window.location.search).get("preset") || "";
  resizeCanvas();
  await loadPreset();
}

init();
</script>
</body>
</html>
