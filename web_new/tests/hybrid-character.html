<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin — гибридный персонаж</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; background: #192425; color: #eddfba; font: 15px system-ui; }
  main { max-width: 1160px; margin: auto; padding: 24px; } h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #a7b6ac; } .controls { display: flex; flex-wrap: wrap; gap: 14px; margin: 20px 0; align-items: center; }
  select,button { background: #2e3b38; color: #eddfba; padding: 8px; border: 1px solid #657563; border-radius: 4px; }
  canvas { display: block; max-width: 100%; image-rendering: pixelated; } pre { white-space: pre-wrap; color: #b5c9b7; font-size: 12px; }
</style></head>
<body><main><h1>Персонаж • realtime 3D → пиксель арт</h1><p>Фиксированные камера и свет. Игровая модель, скелет и отдельная экипировка.</p>
<div class="controls">
<label>Состояние <select id="state"><option value="idle">Покой</option><option value="walk">Ходьба</option><option value="carry_idle">Переноска / покой</option><option value="carry_walk">Переноска / ходьба</option></select></label>
<label>Персонажей <select id="count"><option>8</option><option>1</option><option>30</option></select></label>
<label>Скорость <input id="speed" type="range" min="0" max="3" value="1" step="0.05"></label>
<label><input id="belt" type="checkbox" checked> Пояс</label>
<label><input id="wrap" type="checkbox" checked> Повязка</label>
<button id="context">Потеря / восстановление контекста</button>
</div><div id="preview"></div><pre id="result">Загрузка…</pre></main>
<script type="module" src="/tests/hybrid-character.ts"></script></body></html>
