<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origin — hybrid character</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; background: #192425; color: #eddfba; font: 15px system-ui; }
  main { max-width: 1160px; margin: auto; padding: 24px; } h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #a7b6ac; } .controls { display: flex; flex-wrap: wrap; gap: 14px; margin: 20px 0; align-items: center; }
  select,button { background: #2e3b38; color: #eddfba; padding: 8px; border: 1px solid #657563; border-radius: 4px; }
  canvas { display: block; max-width: 100%; image-rendering: pixelated; } pre { white-space: pre-wrap; color: #b5c9b7; font-size: 12px; }
</style></head>
<body><main><h1>Character • realtime 3D → pixel art</h1><p>Eight screen directions. The line beneath the character shows the path; the dot shows movement direction. The cycle restarts at the end of the segment.</p>
<div class="controls">
<label>State <select id="state"><option value="idle">Idle</option><option value="crawl">Crawl / tired walk</option><option value="walk">Walk</option><option value="run">Run</option><option value="fast_run">Fast run</option><option value="carry_idle">Carry / idle</option><option value="carry_walk">Carry / walk</option><option value="falling">Falling / one shot</option><option value="knocked_out">Knocked out / lying</option></select></label>
<button id="restart-fall">Restart fall</button>
<label>Characters <select id="count"><option>8</option><option>1</option><option>30</option></select></label>
<label>Speed <input id="speed" type="range" min="0" max="3" value="1" step="0.05"></label>
<label><input id="action-play" type="checkbox" checked>Repeat action</label>
<label>Phase <input id="action-phase" type="range" min="0" max="1" value="0.35" step="0.001"></label>
<label>Cycle, ms <input id="action-duration" type="number" min="1" value="2000"></label>
<span>The headband and belt are part of the Meshy model</span>
<button id="context">Lose / restore context</button>
</div><div id="preview"></div><pre id="result">Loading…</pre></main>
<script type="module" src="/tests/hybrid-character.ts"></script></body></html>
