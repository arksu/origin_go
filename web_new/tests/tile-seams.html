<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile seams</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #14231b; color: #e0eadc; font: 14px system-ui, sans-serif; }
    header { flex-shrink: 0; padding: 18px 24px 12px; border-bottom: 1px solid #3c5141; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 6px 0; color: #b7cbb4; }
    #controls { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 16px 0 12px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 12px; color: #b7cbb4; }
    select, button, input[type="color"] { min-height: 36px; padding: 6px 10px; border: 1px solid #58715b; border-radius: 5px; background: #223b2a; color: #edf4e9; font: 14px system-ui; }
    button { cursor: pointer; }
    button:hover { background: #34563a; }
    :focus-visible { outline: 2px solid #b7d88a; outline-offset: 3px; }
    :disabled { opacity: .45; }
    .checkbox { display: flex; gap: 7px; align-items: center; min-height: 36px; }
    #status { min-height: 22px; color: #d1e4c1; }
    #preview { position: relative; flex: 1; width: 100%; min-height: 320px; overflow: hidden; background: #163722; }
    canvas { display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    footer { flex-shrink: 0; padding: 10px 24px; }
    #inspect { min-height: 22px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #error { color: #ffc4ad; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Tile seams</h1>
    <p>Drag the field with the mouse. Scroll to zoom. Textures come from the current client atlas.</p>
    <fieldset id="controls" disabled style="border: 0; padding: 0;">
      <label>Target type<select id="target"></select></label>
      <label>Overlay direction
        <select id="direction">
          <option value="all">All neighboring types</option>
          <option value="target-over">Target over neighbor</option>
          <option value="neighbor-over">Neighbor over target</option>
        </select>
      </label>
      <label>Neighbor type<select id="neighbor"></select></label>
      <label>Field pattern
        <select id="pattern">
          <option value="solid">Target only</option>
          <option value="target-island">Target island in neighbor</option>
          <option value="neighbor-island">Neighbor island in target</option>
          <option value="split-x">Straight X boundary</option>
          <option value="split-y">Straight Y boundary</option>
          <option value="stripes">Stripes</option>
          <option value="checkerboard">Checkerboard regions</option>
          <option value="single-cells">Single neighbor tiles</option>
          <option value="three-way">Three-way junction</option>
        </select>
      </label>
      <label>Third type<select id="third"></select></label>
      <label>Field size
        <select id="size"><option value="16">16 × 16</option><option value="32" selected>32 × 32</option><option value="48">48 × 48</option><option value="64">64 × 64</option></select>
      </label>
      <label>Zoom
        <select id="zoom"><option value="0.25">25%</option><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option><option value="6">600%</option></select>
      </label>
      <label>Background<input id="background" type="color" value="#163722"></label>
      <label class="checkbox"><input id="grid" type="checkbox"> Tile grid</label>
      <label class="checkbox"><input id="chunks" type="checkbox"> Chunk boundaries</label>
      <button id="shuffle" type="button">Shuffle variants</button>
      <button id="fit" type="button">Fit field</button>
      <button id="center" type="button">Center</button>
    </fieldset>
    <p id="status" role="status">Loading atlas…</p>
    <p>Edges of types with smaller IDs overlay types with larger IDs. Zoom to 100% or more to review pixel seams.</p>
  </header>
  <main id="preview" aria-label="Tile seam preview field"></main>
  <footer><div id="inspect">Hover over a tile to see its type and texture variant.</div><pre id="error" role="alert"></pre></footer>
  <script type="module" src="./tile-seams.ts"></script>
</body>
</html>
