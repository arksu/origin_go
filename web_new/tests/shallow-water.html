<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Shallow water — character review</title>
<style>
body { background: #162429; color: #dce5d6; font: 14px system-ui, sans-serif; margin: 24px; }
h1 { font-size: 22px; }
canvas { image-rendering: pixelated; max-width: 100%; }
pre { white-space: pre-wrap; }
button { margin: 8px 8px 8px 0; padding: 8px 16px; }
.texture-review { display: flex; gap: 16px; }
.texture-review figure { margin: 0; }
.texture-review .ripple-preview { width: 240px; height: 120px; image-rendering: pixelated;
  background-image: url('/assets/game/fx/shallow_water/ripples-strip.png');
  background-repeat: no-repeat; background-size: 1200px 120px;
  animation: ripple-frames 1s steps(5) infinite; }
@keyframes ripple-frames { to { background-position: -1200px 0; } }
.texture-review .green { background-color: #243c24; }
.texture-review .water { background-color: #084869; }
</style>
<h1>Shallow water · actual game renderer</h1>
<p>Eight directions: on shore and knee-deep in water. Top row: shore; bottom row: shallow water. Ripples: five frames at 5 FPS.</p>
<div id="preview"></div>
<button id="walk">Walk / stop</button>
<button id="carry">Carry / normal pose</button>
<label>Scene: <select id="count"><option value="16">Eight directions</option><option value="1">1 character</option><option value="30">30 characters</option></select></label>
<pre id="result">Checking…</pre>
<pre id="metrics"></pre>
<div class="texture-review" aria-label="Texture transparency review">
<figure><div class="green ripple-preview" role="img" aria-label="Ripple animation on a dark green background"></div><figcaption>Green · 5 FPS</figcaption></figure>
<figure><div class="water ripple-preview" role="img" aria-label="Ripple animation on a blue water background"></div><figcaption>Water · 5 FPS</figcaption></figure>
</div>
<script type="module" src="/tests/shallow-water.ts"></script>
</html>
