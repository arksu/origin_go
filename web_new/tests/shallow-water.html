<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Мелководье — проверка персонажей</title>
<style>
body { background: #162429; color: #dce5d6; font: 14px system-ui, sans-serif; margin: 24px; }
h1 { font-size: 22px; }
canvas { image-rendering: pixelated; max-width: 100%; }
pre { white-space: pre-wrap; }
button { margin: 8px 8px 8px 0; padding: 8px 16px; }
.texture-review { display: flex; gap: 16px; }
.texture-review figure { margin: 0; }
.texture-review .ripple-preview { width: 240px; height: 120px; image-rendering: pixelated;
  background-image: url('/assets/game/fx/shallow_water/ripples-strip.png');
  background-repeat: no-repeat; background-size: 1200px 120px;
  animation: ripple-frames 1s steps(5) infinite; }
@keyframes ripple-frames { to { background-position: -1200px 0; } }
.texture-review .green { background-color: #243c24; }
.texture-review .water { background-color: #084869; }
</style>
<h1>Мелководье · реальный игровой рендер</h1>
<p>Восемь направлений: на берегу и в воде до середины колена. Верхний ряд — берег, нижний — мелководье. Рябь: пять кадров, 5 FPS.</p>
<div id="preview"></div>
<button id="walk">Ходьба / остановка</button>
<button id="carry">Переноска / обычная поза</button>
<label>Сцена: <select id="count"><option value="16">Восемь направлений</option><option value="1">1 персонаж</option><option value="30">30 персонажей</option></select></label>
<pre id="result">Проверяем…</pre>
<pre id="metrics"></pre>
<div class="texture-review" aria-label="Проверка прозрачных краёв текстуры">
<figure><div class="green ripple-preview" role="img" aria-label="Анимация ряби на тёмно-зелёном фоне"></div><figcaption>Зелёный · 5 FPS</figcaption></figure>
<figure><div class="water ripple-preview" role="img" aria-label="Анимация ряби на синем фоне воды"></div><figcaption>Вода · 5 FPS</figcaption></figure>
</div>
<script type="module" src="/tests/shallow-water.ts"></script>
</html>
