<!doctype html>
<html lang="en">
  <head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Skull Smoke</title>
	<style>
	  * { box-sizing: border-box; }
	  body { margin: 0; background: #171d19; color: #ecf0e9; font: 14px Arial, sans-serif; }
	  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
	  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
	  h1 { margin: 0; font-size: 26px; font-weight: 600; }
	  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
	  label { display: inline-flex; align-items: center; gap: 8px; }
	  button, select { min-height: 34px; color: inherit; background: #28342c; border: 1px solid #536557; border-radius: 4px; }
	  button { display: inline-grid; place-items: center; width: 36px; cursor: pointer; }
	  button:disabled, select:disabled, input:disabled { opacity: .5; cursor: default; }
	  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #addf82; outline-offset: 3px; }
	  select { max-width: 100%; padding: 0 8px; }
	  .transport { display: inline-flex; gap: 8px; }
	  .pause { display: block; width: 12px; height: 14px; border-left: 4px solid currentColor; border-right: 4px solid currentColor; }
	  .play { display: block; width: 0; height: 0; margin-left: 2px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid currentColor; }
	  .replay { font-size: 25px; line-height: 1; }
	  .frame-control { flex-wrap: wrap; }
	  input[type="range"] { width: 150px; max-width: 100%; margin: 0; accent-color: #95c878; }
	  output { min-width: 34px; font-variant-numeric: tabular-nums; color: #abb8ad; }
	  .samples { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 20px; }
	  figure { min-width: 0; margin: 0; }
	  figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 15px; }
	  .scale { flex-shrink: 0; color: #abb8ad; font-size: 12px; }
	  .canvas { width: 100%; height: 260px; overflow: hidden; background: #283c2a; }
	  .canvas.detail { height: 460px; }
	  canvas { display: block; image-rendering: pixelated; }
	  #status { margin: 12px 0 0; min-height: 18px; color: #abb8ad; overflow-wrap: anywhere; }
	  #status:empty { display: none; }
	  @media (max-width: 760px) {
		main { padding: 16px; }
		header { margin-bottom: 16px; }
		.samples { grid-template-columns: minmax(0, 1fr); gap: 16px; }
	  }
	  @media (max-width: 360px) {
		main { padding: 12px; }
	  }
	</style>
  </head>
  <body data-status="loading">
	<main>
	  <header>
		<h1>Skull Smoke</h1>
		<div class="controls">
		  <label>Fire <select id="fire" disabled><option value="hearth_fire">Hearth Fire</option><option value="campfire">Campfire</option><option value="campfire/unlit">Unlit Campfire</option></select></label>
		  <label>Ground <select id="ground" disabled><option value="grass">Grass</option><option value="dirt">Dirt</option></select></label>
		  <span class="transport">
			<button id="playback" type="button" aria-label="Pause" title="Pause" disabled><span class="pause" aria-hidden="true"></span></button>
			<button id="replay" type="button" aria-label="Replay" title="Replay" disabled><span class="replay" aria-hidden="true">&#8634;</span></button>
		  </span>
		  <label class="frame-control">Frame <input id="frame" type="range" min="1" max="8" step="1" value="1" disabled><output id="frame-number" for="frame">1 / 8</output></label>
		</div>
	  </header>
	  <section class="samples" aria-label="Skull Smoke">
		<figure><figcaption><span class="fire-name">Hearth Fire</span><span class="scale">1x</span></figcaption><div id="game-scale" class="canvas"></div></figure>
		<figure><figcaption><span class="fire-name">Hearth Fire</span><span class="scale">3x</span></figcaption><div id="detail" class="canvas detail"></div></figure>
	  </section>
	  <p id="status" role="status">Loading...</p>
	</main>
	<script type="module" src="./skull-smoke-art-review.ts"></script>
  </body>
</html>
